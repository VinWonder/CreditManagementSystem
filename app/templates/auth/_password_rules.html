{# Live checklist for the password rules enforced by strong_password in app/auth/forms.py. #}
{% macro password_rules() %}
<ul class="password-rules" data-password-rules aria-label="Password requirements">
  <li data-rule="length"><i class="bi bi-circle" aria-hidden="true"></i> At least 8 characters</li>
  <li data-rule="upper"><i class="bi bi-circle" aria-hidden="true"></i> An uppercase letter</li>
  <li data-rule="lower"><i class="bi bi-circle" aria-hidden="true"></i> A lowercase letter</li>
  <li data-rule="number"><i class="bi bi-circle" aria-hidden="true"></i> A number</li>
  <li data-rule="symbol"><i class="bi bi-circle" aria-hidden="true"></i> A symbol such as ! @ # or $</li>
  <li data-rule="nospace" class="is-met"><i class="bi bi-check-circle-fill" aria-hidden="true"></i> No spaces</li>
</ul>
{% endmacro %}
